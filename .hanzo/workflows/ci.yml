name: CI

# Build, vet and test on the native runners (git.hanzo.ai → git-runner).
#
# This replaces .github/workflows/ci.yml, whose two jobs named
# `runs-on: lux-build-amd64`. No runner on this forge carries that label — the
# pools are `lux-build-linux-<arch>` — and a job naming a label nothing carries
# does not fail, it waits. Every push left two such jobs queued.
#
# So the rule here is that every job names a label the fleet actually carries.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off

jobs:
  test:
    runs-on: [lux-build-linux-amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 -short -timeout 300s ./...

  govulncheck:
    runs-on: [lux-build-linux-amd64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Advisory: reports findings without gating the merge. Kept as it was —
      # turning it blocking is a policy decision, not a migration.
      - run: govulncheck ./... || true
